name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh data every 6 hours
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Fetch Azure DevOps data ──────────────────────────
      - name: Fetch Azure DevOps Branches & Pull Requests
        if: ${{ secrets.AZURE_DEVOPS_PAT != '' }}
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_ORG: ${{ vars.AZURE_ORG }}
          AZURE_PROJECT: ${{ vars.AZURE_PROJECT }}
        run: |
          python3 fetch-azure-data.py \
            --pat "$AZURE_PAT" \
            --org "$AZURE_ORG" \
            --project "$AZURE_PROJECT"

      # ── Commit updated data.js if it changed ─────────────
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet js/data.js || \
            git commit -am "chore: auto-refresh Azure DevOps data [skip ci]"
          git push || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
